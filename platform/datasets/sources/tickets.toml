# Ticket sources for teamtrack-features-v1.
#
# The course's dataset script (not part of this repository) reads this file together with the task manifests
# (teamtrack/reference/<task>/task.toml). Canonical tickets live in the manifests; this file holds
# the variants:
#   [[reworded]]        21 = F1-F7 x 3 styles: terse, pm (product-manager prose), bug (bug report)
#   [[trap]]             7 = one per feature; `trap` names the temptation: "legacy-pattern" (the
#                        legacy /v1 code is nearby) or "tempting-middleware" (shared middleware)
#   [[session_stop]]     9 = F2, F6, F7 x 3 stop points; the first session gets `first_session_share`
#                        of the manifest's total turn budget and the second session the rest
#   [[alt_checkpoint]]   8 = F1-F4 x m1-alt-a, m1-alt-b; the canonical ticket from another start
# Every variant states the same requirements as the feature's spec (contract §4) and points to it;
# the specs are in docs/features/ for both arms (ruling R-4). Session-stop and alternate-checkpoint
# variants reuse the canonical ticket unless they set `text`.

# -- F1 org-wide issue search -------------------------------------------------------------------

[[reworded]]
feature = "F1"
style = "terse"
text = '''Add GET /issues: the caller's org's issues across all projects.
Optional filters, combined with AND: status (open|in_progress|done), priority (low|medium|high),
assignee_id, project_id, q (1-100 chars, case-insensitive substring of the title).
Exclude deleted issues and issues in archived projects. A project_id or assignee_id from another org
is 404 not_found; an invalid value is 422 validation_error. Any role may read. Items are IssueOut;
the usual cursor/limit list envelope.
Spec: docs/features/f1.md.'''

[[reworded]]
feature = "F1"
style = "pm"
text = '''Team leads who look after several projects keep switching between boards to see what is
open, because issues can only be listed one project at a time. We want a single org-wide issue
list, GET /issues, that people can narrow down by status, priority, assignee, project, and a search
on the title (1 to 100 characters, case does not matter). Filters combine, so "open, high priority,
assigned to me" is one request.

The list should behave like every other list in TeamTrack: cursor and limit, the
{"items": [...], "next_cursor": ...} envelope, items shaped like IssueOut. It must never show deleted
issues or issues from archived projects, and it only ever shows the caller's own organization: a
project or assignee from another org should look as if it does not exist (404), and a bad filter
value is a 422. Everyone can use it, viewers included.

The full spec is in docs/features/f1.md.'''

[[reworded]]
feature = "F1"
style = "bug"
text = '''Bug: there is no way to list issues across projects

Steps: sign in as member@acme.test and try to find every open, high-priority issue assigned to you.
Expected: one request, GET /issues?status=open&priority=high&assignee_id=<your id>, returns them from
every project in your org, paged with cursor and limit.
Actual: the endpoint does not exist; you have to page through GET /projects/{project_id}/issues for
each project.

Notes: filters are status, priority, assignee_id, project_id, and q (title contains, any case, 1-100
characters), combined with AND. Deleted issues and issues of archived projects must not appear. A
project_id or assignee_id of another org should give 404 not_found, an invalid value 422
validation_error. Any role may read; items are IssueOut. Spec: docs/features/f1.md.'''

[[trap]]
feature = "F1"
trap = "legacy-pattern"
trap_detail = "GET /v1/issues (app/api/legacy_v1.py, services.legacy) already returns every issue"
text = '''We need an org-wide issue list: GET /issues returns the caller's org's issues across all
projects. The old reporting client already reads every issue through GET /v1/issues
(app/api/legacy_v1.py and services.legacy), so a lot of the query code exists.

Filters, all optional and combined with AND: status (open|in_progress|done), priority
(low|medium|high), assignee_id, project_id, and q (1-100 characters, case-insensitive substring of
the title). Deleted issues and issues of archived projects are excluded. A project_id or assignee_id
that is not in the caller's org gives 404 not_found; an invalid value gives 422 validation_error. Any
role may read. Items are IssueOut, in the usual cursor-paginated list envelope.

Spec: docs/features/f1.md.'''

# -- F2 comments --------------------------------------------------------------------------------

[[reworded]]
feature = "F2"
style = "terse"
text = '''Add issue comments.
- POST /issues/{issue_id}/comments {"body": 1-5000 chars} -> 201 CommentOut {id, org_id, issue_id,
  author_id, body, created_at}; accepts Idempotency-Key.
- GET /issues/{issue_id}/comments -> list, oldest first.
- DELETE /comments/{comment_id} -> 204 for the author or an admin, 403 otherwise.
A deleted issue or one in an archived project is 404. Audit actions comment.create and
comment.delete. New comments table, one migration. Seed two comments per org on each org's first
issue. Board: comments panel on the issue page.
Spec: docs/features/f2.md.'''

[[reworded]]
feature = "F2"
style = "pm"
text = '''People discuss issues in chat today, and the discussion is lost once the chat scrolls away.
We want comments on issues. Anyone who can write can add a comment (up to 5000 characters) to an
issue, everyone in the org can read an issue's comments in the order they were written, and a
comment can be deleted by the person who wrote it or by an admin, nobody else (403).

Comments belong to the issue: when the issue is deleted or its project archived, its comments are
gone too (404). Adding and deleting comments shows up in the audit log as comment.create and
comment.delete. The API is POST and GET /issues/{issue_id}/comments and DELETE
/comments/{comment_id}; the create returns 201 with the new comment and, like every create, accepts
an Idempotency-Key. Comments need their own table (one migration), and the demo data should have two
comments on each org's first issue. On the board, the issue page gets a comments panel with a form
for people who can write.

The full spec is in docs/features/f2.md.'''

[[reworded]]
feature = "F2"
style = "bug"
text = '''Bug: issues have no comments

Steps: open any issue on the board (for example as member@acme.test) and try to leave a note.
Expected: a comments panel lists the issue's comments oldest first and has a form to add one; the
API has POST /issues/{issue_id}/comments ({"body": 1-5000 characters}, 201 CommentOut with id,
org_id, issue_id, author_id, body, created_at), GET /issues/{issue_id}/comments, and DELETE
/comments/{comment_id} (204 for the author or an admin, 403 for anyone else).
Actual: none of this exists.

Notes: a deleted issue or an issue in an archived project gives 404. Audit actions comment.create and
comment.delete. New comments table with one migration; seed two comments per org on each org's first
issue. The create accepts Idempotency-Key. Spec: docs/features/f2.md.'''

[[trap]]
feature = "F2"
trap = "legacy-pattern"
trap_detail = "the legacy GET /v1/issues list handler (app/api/legacy_v1.py) is the shortest list code to copy"
text = '''Add comments to issues. The shortest existing list handler is the one the old reporting client
uses, GET /v1/issues in app/api/legacy_v1.py; the comment list has a similar shape.

- POST /issues/{issue_id}/comments with {"body": 1-5000 characters} returns 201 CommentOut {id,
