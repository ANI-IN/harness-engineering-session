# -- F6 watchers --------------------------------------------------------------------------------

[[reworded]]
feature = "F6"
style = "terse"
text = '''Add issue watchers.
- PUT /issues/{issue_id}/watchers/me -> 204 (repeat: 204, no change, no audit row).
- DELETE /issues/{issue_id}/watchers/me -> 204.
- GET /issues/{issue_id}/watchers -> list of {user_id, created_at}.
- GET /me/watching -> list of IssueOut, deleted issues excluded.
- Admins: PUT/DELETE /issues/{issue_id}/watchers/{user_id} for a user of their org (404 otherwise).
Audit watcher.add, watcher.remove. New table, one migration, seeded watchers with stable ids.
Spec: docs/features/f6.md.'''

[[reworded]]
feature = "F6"
style = "pm"
text = '''People want to follow issues they care about without being assigned to them. Let anyone who
can write watch or stop watching an issue (PUT and DELETE /issues/{issue_id}/watchers/me, both 204;
watching an issue you already watch changes nothing and writes no audit row). Anyone in the org can
see who watches an issue (GET /issues/{issue_id}/watchers, each entry with user_id and created_at),
and everyone gets their own "watching" list (GET /me/watching, issues shaped like IssueOut, without
deleted issues).

Admins sometimes add a teammate as a watcher, so admins may also PUT or DELETE
/issues/{issue_id}/watchers/{user_id} for any user of their own org; a user from another org is a
404. Watching and unwatching appear in the audit log as watcher.add and watcher.remove. Watchers need
their own table (one migration), and the demo data should include a few watchers with stable ids.

The full spec is in docs/features/f6.md.'''

