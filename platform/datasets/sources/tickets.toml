# -- F7 labels ----------------------------------------------------------------------------------

[[reworded]]
feature = "F7"
style = "terse"
text = '''Add labels.
- GET /labels; POST /labels {"name": 1-50 chars, "color": "#rrggbb"} -> 201 (names unique per org,
  case-insensitive: 409 label_exists); PATCH /labels/{label_id}; DELETE /labels/{label_id} -> 204
  (removes it from issues).
- POST /issues/{issue_id}/labels {"label_id": int} -> 200 IssueOut; DELETE
  /issues/{issue_id}/labels/{label_id} -> 204.
- GET /projects/{project_id}/issues (and GET /issues where it exists) accept label_id.
- IssueOut gains labels: [{id, name, color}].
Members and admins write; viewers 403. Seeded labels with stable ids; one migration.
Spec: docs/features/f7.md.'''

[[reworded]]
feature = "F7"
style = "pm"
text = '''Teams want to tag issues ("bug", "customer", "release-blocker") and filter by those tags. Each
org manages its own set of labels: list them (GET /labels), create one with a name of 1 to 50
characters and a colour like #1f6feb (POST /labels, 201; two labels in one org cannot share a name,
ignoring case: 409 label_exists), rename or recolour one (PATCH /labels/{label_id}), and delete one
(DELETE /labels/{label_id}, 204, which also takes it off every issue).

Labels go on issues with POST /issues/{issue_id}/labels {"label_id": ...} (returns the issue, 200) and
come off with DELETE /issues/{issue_id}/labels/{label_id} (204). Every issue in responses shows its
labels (IssueOut gets labels: [{id, name, color}]), and the project issue list (and the org-wide
issue list, where it exists) can be filtered with label_id. Members and admins can change labels;
viewers get 403. The demo data should include labels with stable ids; new tables come with one
migration.

The full spec is in docs/features/f7.md.'''

[[reworded]]
feature = "F7"
style = "bug"
text = '''Bug: issues cannot be labelled or filtered by label

