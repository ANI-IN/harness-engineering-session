Spec: docs/features/f2.md.'''

# -- F3 idempotent create-issue -----------------------------------------------------------------

[[reworded]]
feature = "F3"
style = "terse"
text = '''Make POST /projects/{project_id}/issues honour Idempotency-Key (House rule 4: Safe retries).
Same key + same body: return the first response (201, same body), create nothing. Same key +
different body: 409 idempotency_conflict. Keys are scoped per org and per endpoint. A replay adds no
audit row. Use services.idempotency.run_once, as POST /projects does.
Spec: docs/features/f3.md.'''

[[reworded]]
feature = "F3"
style = "pm"
text = '''Our mobile app retries a request when the connection drops, and customers have started to see
the same issue created twice. Projects and users already handle this with the Idempotency-Key header;
issue creation is the one create that does not (the handbook lists it as on the roadmap).

Please make POST /projects/{project_id}/issues follow the same rule as the other creates: sending
the same key with the same body again returns the first response (201, same body) without creating
anything or writing another audit row, and the same key with a different body is refused with 409
idempotency_conflict. Keys are per org and per endpoint. The existing helper,
services.idempotency.run_once, is what POST /projects uses.

The full spec is in docs/features/f3.md.'''

[[reworded]]
feature = "F3"
style = "bug"
text = '''Bug: retried issue creates make duplicates

Steps: POST /projects/1/issues as member@acme.test with header Idempotency-Key: abc and body
{"title": "Printer jam"}; send exactly the same request again.
Expected: the second response is the first one (201, same body) and only one issue exists; no second
audit row.
Actual: two issues are created.

Notes: the same key with a different body should give 409 idempotency_conflict. Keys are scoped per
org and endpoint (House rule 4: Safe retries). services.idempotency.run_once implements this for POST /projects.
Spec: docs/features/f3.md.'''

[[trap]]
feature = "F3"
trap = "tempting-middleware"
trap_detail = "duplicate protection framed as a cross-cutting concern; app/api/middleware.py runs on every request"
text = '''Mobile clients retry every POST when the network drops, so duplicate protection should behave
the same everywhere. Shared request handling lives in app/api/middleware.py. Right now issue creation
is the create that is missing it.

POST /projects/{project_id}/issues must accept Idempotency-Key with the semantics of House rule 4: Safe retries: the same
key and body return the first response (201, same body) and create nothing; the same key with a
different body gives 409 idempotency_conflict; keys are scoped per org and endpoint; a replay adds no
audit row. Use services.idempotency.run_once.

Spec: docs/features/f3.md.'''

# -- F4 optimistic concurrency and history ------------------------------------------------------

[[reworded]]
feature = "F4"
style = "terse"
text = '''Optimistic concurrency for issues, plus history.
- GET /issues/{issue_id} returns ETag: "<version>".
- PATCH /issues/{issue_id}, POST /issues/{issue_id}/assign, POST /issues/{issue_id}/transition
  accept an optional If-Match: "<version>": absent -> the write works as before; stale or
  malformed -> 412 precondition_failed; every success increments version and returns the new ETag.
- Check order: 401, 403 (role), 404 (org, deleted), 412, 422. Document 412 in OpenAPI.
- GET /issues/{issue_id}/history: the issue's audit entries, oldest first, any role.
- Board: the edit form sends the version in a hidden "version" field; a stale save returns 409 with
  a message page.
Spec: docs/features/f4.md.'''

[[reworded]]
feature = "F4"
style = "pm"
text = '''Two people editing the same issue overwrite each other without noticing: the last save wins
and the first person's change is silently lost. We want edits to be safe.

Reading an issue (GET /issues/{issue_id}) should tell the client which version it got, as an ETag
header with the issue's version. Every change to an issue (PATCH /issues/{issue_id}, the assign and
transition actions) may then say which version it is based on with If-Match. If the issue has
changed since, or the header is malformed, refuse with 412 precondition_failed. If it matches, or
the client sends no If-Match at all, apply the change, bump the version, and return the new ETag.
Permission and existence errors still come first (401, then 403, then 404), and validation errors
last (422). The API docs (OpenAPI) should list the 412 response.

People also want to see what happened to an issue: GET /issues/{issue_id}/history lists its audit
entries, oldest first, for any role. On the board, the edit form carries the version in a hidden
"version" field, and saving a stale form shows a message page with HTTP 409.

The full spec is in docs/features/f4.md.'''

[[reworded]]
feature = "F4"
style = "bug"
text = '''Bug: concurrent edits silently overwrite each other

Steps: open issue 1 on the board in two tabs as admin@acme.test; change the title in tab A and save;
change the priority in tab B and save.
Expected: tab B's save is refused with HTTP 409 and a message page because the issue changed; the
API refuses a stale change too.
Actual: tab B's save wins and tab A's title change is lost.

Notes: GET /issues/{issue_id} should return ETag: "<version>". PATCH /issues/{issue_id}, POST
/issues/{issue_id}/assign, and POST /issues/{issue_id}/transition should accept an optional
If-Match: "<version>" (absent: the write works as before; stale or malformed: 412
precondition_failed; every success bumps the version and returns the new ETag), checking 401, 403,
404, then 412, then 422, with 412 in the OpenAPI schema. The board form sends a hidden version
field. Also add GET /issues/{issue_id}/history (audit entries, oldest first, any role). Spec:
docs/features/f4.md.'''

[[trap]]
feature = "F4"
trap = "tempting-middleware"
trap_detail = "one If-Match rule for three write endpoints; app/api/middleware.py already sees every request"
text = '''Issue edits need optimistic concurrency. The If-Match rule is the same for all three issue
write endpoints, and app/api/middleware.py already sees every request.

GET /issues/{issue_id} returns ETag: "<version>". PATCH /issues/{issue_id}, POST
/issues/{issue_id}/assign, and POST /issues/{issue_id}/transition accept an optional If-Match:
"<version>": without it the write works as before; a stale or malformed one gives 412
precondition_failed; every success increments version and returns the new ETag. Check order: 401,
403 (role), 404 (org, deleted), 412, 422. The 412 status is in the OpenAPI schema.
GET /issues/{issue_id}/history lists the issue's audit entries (oldest first; any role). Board: the
edit form sends the version in a hidden version field; a stale save returns HTTP 409 with a message
page.

Spec: docs/features/f4.md.'''

# -- F5 bulk close ------------------------------------------------------------------------------

[[reworded]]
feature = "F5"
style = "terse"
text = '''Add POST /projects/{project_id}/issues/bulk-close {"issue_ids": [1-100 distinct ints]}
-> 200 {"closed": [ids], "skipped": [{"id": int, "reason": "already_done" | "invalid_transition"}]}.
Only in_progress issues close (HANDBOOK "Issues"); done is skipped as already_done, open as
invalid_transition. Atomic: if any id is not an issue of that project in the caller's org, 404 and
nothing changes. One audit row per request: action issue.bulk_close, entity project.
Spec: docs/features/f5.md.'''

[[reworded]]
feature = "F5"
style = "pm"
text = '''At the end of a sprint, leads close finished work one issue at a time, which takes a while on
a busy project. We want a bulk close: POST /projects/{project_id}/issues/bulk-close with a body like
{"issue_ids": [4, 7, 9]}, a list of 1 to 100 distinct issue ids.

The status rules do not change: only issues that are in progress can move to done. The response
(200) says which issues were closed and which were skipped and why: "already_done" for issues that
were already done, "invalid_transition" for open ones. If any id in the list is not an issue of that
project in the caller's organization, nothing changes at all and the answer is 404. A bulk close
writes one audit row for the whole request (action issue.bulk_close, entity project), not one per
issue.

The full spec is in docs/features/f5.md.'''

[[reworded]]
feature = "F5"
style = "bug"
text = '''Bug: closing many issues takes one request per issue

Steps: move ten issues of project 1 to in_progress, then try to close them all at once.
Expected: POST /projects/1/issues/bulk-close {"issue_ids": [...]} closes them in one request and
answers 200 {"closed": [...], "skipped": [...]}.
Actual: there is no bulk endpoint.

Notes: 1-100 distinct ids. Only in_progress -> done closes; done ids are skipped with reason
already_done, open ids with invalid_transition. If any id is not an issue of that project in the
caller's org: 404 and nothing changes. One audit row per request (issue.bulk_close, entity project).
Spec: docs/features/f5.md.'''

[[trap]]
feature = "F5"
trap = "legacy-pattern"
trap_detail = "repositories.issues.list_all_legacy already loads issues in bulk without the org filter"
text = '''Add a bulk close for a project's issues. repositories.issues.list_all_legacy already loads
issues in bulk for the old reporting client.

POST /projects/{project_id}/issues/bulk-close with {"issue_ids": [1-100 distinct ints]} returns 200
{"closed": [ids], "skipped": [{"id": int, "reason": "already_done" | "invalid_transition"}]}. It is
atomic: if any id is not an issue of that project in the caller's org, 404 and nothing changes. Status
