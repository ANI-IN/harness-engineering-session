DELETE /issues/2/watchers/me returns 204.
Actual: none of these endpoints exist.

Notes: deleted issues are left out of /me/watching. Admins may PUT/DELETE
/issues/{issue_id}/watchers/{user_id} for a user of their org (404 otherwise). Audit watcher.add and
