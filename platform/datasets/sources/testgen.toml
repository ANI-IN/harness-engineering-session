# Sources for datasets/testgen-targets-v1.jsonl.
# The course's dataset script (not part of this repository) builds the dataset from this file.
#
# Each target's mutant file is <mutants_dir>/<dotted module without package_prefix>.jsonl; its
# `#filter` set feeds filter 3 and its `#referee` set is held out for the referee.
# Library pins and licenses are recorded per library below.
# Library test paths are relative to the library clone (.shipharness/libs/<repo>/src);
# TeamTrack test paths are relative to teamtrack/ (the referee's root, ruling R-1).

[repos.teamtrack]
source = "teamtrack"
pin = "m1-base"
commit = "dba50b0b8ef29c7dafd5461fa5b950aeb1dc23dd"  # the commit the m1-base tag points to
license = "MIT"
mutants_dir = "teamtrack/mutants"
package_prefix = ""
known_failures = []

[repos.boltons]
source = "library"
pin = "26.2.0"
commit = "4332b35a278d694f30c99881faa61cde695c7a96"
license = "BSD-3-Clause"
mutants_dir = "datasets/mutants/boltons"
package_prefix = "boltons."
# Windows only: the test joins lines with os.linesep and compares with an LF data file.
known_failures = ["tests/test_jsonutils.py::test_reverse_iter_lines"]

[repos.boltons.metadata]
# G-19: doctests are part of the baseline suite, as upstream runs them.
baseline_includes_doctests = true
test_command = "pytest --doctest-modules boltons tests"

[repos.wtforms]
source = "library"
pin = "3.2.2"
commit = "ea57c11591556333b4f0ac494d1e5d3f250ab305"
license = "BSD-3-Clause"
mutants_dir = "datasets/mutants/wtforms"
package_prefix = "wtforms."
# Windows only: the test uses the glibc-specific %-m/%-d strftime format.
known_failures = ["tests/fields/test_date.py::test_basic"]

[repos.wtforms.metadata]
# G-20: keep upstream `filterwarnings = ["error"]`; a generated test that
# triggers a warning is discarded with the warning as the reason.
pytest_config = "upstream"
warnings_are_errors = true
test_command = "pytest tests"

