{% extends "base.html" %}
{% block title %}Sign in · TeamTrack{% endblock %}
{% block content %}
<section class="login">
  <h1>Choose a demo user</h1>
  <p>Demo sign-in for local use only.</p>
  <ul class="user-list">
    {% for email in demo_users %}
    <li>
      <form method="post" action="/board/login">
        <input type="hidden" name="email" value="{{ email }}">
        <button type="submit">{{ email }}</button>
      </form>
    </li>
    {% endfor %}
  </ul>
</section>
{% endblock %}
